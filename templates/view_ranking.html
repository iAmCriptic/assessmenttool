<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranglisten</title>
    <link id="faviconLink" href="{{ url_for('general.static_files', filename='img/logo_V2.png') }}" rel="icon" type="image/vnd.microsoft.icon">
    <link rel="manifest" href="{{ url_for('general.static_files', filename='manifest.json') }}">
    <script src="https://cdn.tailwindcss.com"></script>
    {# Flagsome (Flaticon Uicons) CSS für Icons #}
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/2.2.0/uicons-regular-rounded/css/uicons-regular-rounded.css'>
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/2.2.0/uicons-solid-rounded/css/uicons-solid-rounded.css'>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .main-content-area {
            background-color: #ffffff;
            color: #1f2937;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .dark .main-content-area {
            background-color: #000000;
            color: #e2e8f0;
        }
        .dark .text-gray-800 { color: #e2e8f0; }
        .dark .text-gray-600 { color: #cbd5e0; }
        .dark .border-gray-200 { border-color: #4a5568; }
        .dark .shadow-md {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5), 0 2px 4px -1px rgba(0, 0, 0, 0.3);
        }
        .mode-btn.active {
            background-color: #2563eb;
            color: #ffffff;
            border-color: #2563eb;
        }
        #darkModeToggle, #backButton {
            background-color: #000000 !important;
            color: #ffffff !important;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.3s ease, color 0.3s ease;
            border-radius: 0.5rem;
        }
        body.dark #darkModeToggle, body.dark #backButton {
            background-color: #ffffff !important;
            color: #000000 !important;
        }
        .table-wrap table {
            width: 100%;
            border-collapse: collapse;
            border: 1px solid #e5e7eb;
            border-radius: 0.5rem;
            overflow: hidden;
        }
        .table-wrap th, .table-wrap td {
            padding: 0.625rem 0.75rem;
            border-top: 1px solid #e5e7eb;
            text-align: left;
            font-size: 0.95rem;
        }
        .table-wrap thead th {
            border-top: none;
            background: #f3f4f6;
            font-weight: 600;
        }
        .dark .table-wrap table { border-color: #4a5568; }
        .dark .table-wrap th, .dark .table-wrap td { border-color: #4a5568; color: #e2e8f0; }
        .dark .table-wrap thead th { background: #1f2937; }
    </style>
</head>
<body class="{{ 'dark' if dark_mode_enabled else '' }}">
    <div class="main-content-area p-8 rounded-lg shadow-md w-full max-w-5xl border border-gray-200 relative pt-20">
        <div class="absolute top-0 left-0 p-4">
            <button id="backButton" class="w-12 h-12 transition duration-300 rounded-lg" title="Zurück">
                <i class="fi fi-rr-angle-left"></i>
            </button>
        </div>
        <div class="absolute top-0 right-0 p-4">
            <button id="darkModeToggle" class="w-12 h-12 transition duration-300 rounded-lg" title="Dark Mode">
                <i class="fi fi-rr-eclipse-alt"></i>
            </button>
        </div>

        <div class="flex items-center justify-between gap-3 mb-6">
            <h2 class="text-3xl font-bold text-gray-800 text-center w-full">Ranglisten</h2>
        </div>

        <div class="main-content-area rounded-lg border border-gray-200 p-5">
            <div class="flex items-center justify-between flex-wrap gap-2 mb-4">
                <div class="flex flex-wrap gap-2">
                    <button class="mode-btn px-3 py-2 rounded-lg border border-gray-300 bg-white" data-mode="standard">Standard</button>
                    <button class="mode-btn px-3 py-2 rounded-lg border border-gray-300 bg-white" data-mode="visitor">Besucherrangliste</button>
                    <button class="mode-btn px-3 py-2 rounded-lg border border-gray-300 bg-white" data-mode="combined">Kombiniert (50/50)</button>
                </div>
                <span id="sortBadge" class="text-sm text-gray-600"></span>
            </div>

            <div id="rankingTableContainer" class="overflow-x-auto table-wrap"></div>
            <p id="noRankingsMessage" class="text-center text-gray-600 hidden">Es liegen noch keine Bewertungen vor.</p>

            <div class="mt-6 text-center">
                <a id="printLink" href="{{ url_for('ranking.print_ranking_page') }}" target="_blank"
                   class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg transition duration-200">
                    Seite drucken / als PDF speichern
                </a>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const body = document.body;
            const rankingTableContainer = document.getElementById('rankingTableContainer');
            const noRankingsMessage = document.getElementById('noRankingsMessage');
            const sortBadge = document.getElementById('sortBadge');
            const printLink = document.getElementById('printLink');
            const modeButtons = Array.from(document.querySelectorAll('.mode-btn'));
            const darkModeToggle = document.getElementById('darkModeToggle');
            const backButton = document.getElementById('backButton');
            const faviconLink = document.getElementById('faviconLink');
            let currentMode = 'standard';

            function updateModeButtons() {
                modeButtons.forEach(btn => btn.classList.toggle('active', btn.dataset.mode === currentMode));
            }

            async function fetchAndRenderRankings(modeOverride = null) {
                try {
                    const mode = modeOverride || currentMode;
                    currentMode = mode;
                    updateModeButtons();
                    printLink.href = `{{ url_for('ranking.print_ranking_page') }}?mode=${encodeURIComponent(currentMode)}`;
                    const response = await fetch(`/api/ranking_data?mode=${encodeURIComponent(currentMode)}`);
                    const data = await response.json();

                    if (data.success && data.rankings.length > 0) {
                        noRankingsMessage.classList.add('hidden');
                        sortBadge.textContent = data.sort_mode === 'average'
                            ? 'Sortierung: Durchschnitt'
                            : 'Sortierung: Gesamtpunktzahl';
                        let tableHtml = `<table>
                            <thead>
                                <tr>
                                    <th class="py-2 px-3 text-left">Rang</th>
                                    <th class="py-2 px-3 text-left">Stand</th>
                                    <th class="py-2 px-3 text-left">Raum</th>
                                    <th class="py-2 px-3 text-left">Gesamtpunkte</th>
                                    <th class="py-2 px-3 text-left">Ø Punkte</th>
                                    <th class="py-2 px-3 text-left">Anzahl Bewertungen</th>
                                </tr>
                            </thead>
                            <tbody>`;
                        data.rankings.forEach(ranking => {
                            tableHtml += `<tr>
                                <td class="py-2 px-3 font-bold">${ranking.rank}</td>
                                <td class="py-2 px-3">${ranking.stand_name}</td>
                                <td class="py-2 px-3">${ranking.room_name || '-'}</td>
                                <td class="py-2 px-3">${ranking.total_achieved_score}</td>
                                <td class="py-2 px-3">${ranking.average_score}</td>
                                <td class="py-2 px-3">${ranking.num_evaluators}</td>
                            </tr>`;
                        });
                        tableHtml += `</tbody></table>`;
                        rankingTableContainer.innerHTML = tableHtml;
                    } else {
                        rankingTableContainer.innerHTML = '';
                        noRankingsMessage.classList.remove('hidden');
                    }
                } catch (error) {
                    rankingTableContainer.innerHTML = '';
                    noRankingsMessage.classList.remove('hidden');
                }
            }

            async function applyAppSettings(isDarkModeOverride = null) {
                try {
                    const response = await fetch('/api/admin_settings');
                    const result = await response.json();
                    if (!result.success) return;
                    const settings = result.settings || {};
                    const isDarkMode = isDarkModeOverride !== null ? isDarkModeOverride : body.classList.contains('dark');

                    if (isDarkMode && settings.dark_bg_gradient_color1 && settings.dark_bg_gradient_color2) {
                        body.style.background = `linear-gradient(to bottom right, ${settings.dark_bg_gradient_color1}, ${settings.dark_bg_gradient_color2})`;
                        body.classList.add('dark');
                    } else if (settings.bg_gradient_color1 && settings.bg_gradient_color2) {
                        body.style.background = `linear-gradient(to bottom right, ${settings.bg_gradient_color1}, ${settings.bg_gradient_color2})`;
                        body.classList.remove('dark');
                    }

                    if (settings.logo_url) {
                        faviconLink.href = settings.logo_url;
                    }
                } catch (error) {
                    // Seite bleibt funktionsfähig ohne Styling-Settings.
                }
            }

            darkModeToggle.addEventListener('click', async () => {
                try {
                    const response = await fetch('{{ url_for("general.toggle_dark_mode") }}', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' }
                    });
                    const data = await response.json();
                    await applyAppSettings(data.dark_mode_enabled);
                } catch (error) {
                    // no-op
                }
            });

            backButton.addEventListener('click', () => {
                window.location.href = window.withAppRoot ? window.withAppRoot('{{ url_for("general.home") }}') : '{{ url_for("general.home") }}';
            });

            modeButtons.forEach(btn => btn.addEventListener('click', () => fetchAndRenderRankings(btn.dataset.mode)));
            fetchAndRenderRankings('{{ request.args.get("mode", "") }}' || null);
            applyAppSettings(body.classList.contains('dark'));
        });
    </script>
</body>
</html>
